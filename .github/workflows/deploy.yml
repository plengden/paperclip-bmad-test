name: deploy

run-name: ${{ inputs.action || 'deploy' }} ${{ inputs.releaseId }} -> ${{ inputs.environment }}

# Prototype "deploy": validates inputs and records what WOULD be deployed. Deploys nothing real.
# Triggered only by workflow_dispatch (the Paperclip deploy tool calls this).
# The production environment has required reviewers, which is the second lock behind Paperclip's approval.
on:
  workflow_dispatch:
    inputs:
      action:
        description: deploy or rollback
        required: false
        default: deploy
        type: choice
        options: [deploy, rollback]
      releaseId:
        description: Release id (e.g. rel-5)
        required: true
        type: string
      artifactDigest:
        description: Artifact digest (sha256:<64 hex>); required for deploy, ignored for rollback
        required: false
        default: ''
        type: string
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]
      riskClass:
        description: Risk class
        required: true
        type: choice
        options: [low, medium, high]

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  verify-checks:
    # CD-side lock: refuse to deploy a commit whose required CI gate did not pass. Rollbacks are exempt.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - name: Require a successful ci-gate on this commit
        if: ${{ inputs.action != 'rollback' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          result=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs?per_page=100" \
            --jq '[.check_runs[]|select(.name=="ci-gate")|.conclusion]|first // "missing"')
          echo "ci-gate on ${{ github.sha }}: $result"
          [[ "$result" == "success" ]] || { echo "::error::ci-gate is '$result' for this commit; refusing to deploy"; exit 1; }
      - name: Rollback skips the CI check
        if: ${{ inputs.action == 'rollback' }}
        run: echo "rollback: CI check not required"

  deploy:
    needs: verify-checks
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Validate inputs
        env:
          ACTION: ${{ inputs.action }}
          RELEASE_ID: ${{ inputs.releaseId }}
          DIGEST: ${{ inputs.artifactDigest }}
        run: |
          [[ "$RELEASE_ID" =~ ^[A-Za-z0-9._-]{1,64}$ ]] || { echo "bad releaseId"; exit 1; }
          if [[ "$ACTION" != "rollback" ]]; then
            [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "bad artifactDigest"; exit 1; }
          fi
      - name: Record deployment (no real deploy)
        env:
          ACTION: ${{ inputs.action }}
          RELEASE_ID: ${{ inputs.releaseId }}
          DIGEST: ${{ inputs.artifactDigest }}
          ENVIRONMENT: ${{ inputs.environment }}
          RISK: ${{ inputs.riskClass }}
        run: |
          {
            echo "## Deployment record (prototype, nothing deployed)"
            echo "| field | value |"
            echo "|---|---|"
            echo "| action | ${ACTION:-deploy} |"
            echo "| release | $RELEASE_ID |"
            echo "| artifact | $DIGEST |"
            echo "| environment | $ENVIRONMENT |"
            echo "| riskClass | $RISK |"
            echo "| actor | ${{ github.actor }} |"
            echo "| run | ${{ github.run_id }} |"
            echo "| sha | ${{ github.sha }} |"
          } >> "$GITHUB_STEP_SUMMARY"
