name: ci

# Required checks. `ci-gate` is the single status that branch protection requires and that deploy.yml verifies.
# Third-party actions are pinned by tag for this prototype; pin by commit SHA before real use.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
        working-directory: app

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 detect --source=/repo --redact --no-banner

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: semgrep
        run: |
          python -m pip install --quiet semgrep
          semgrep scan --config p/javascript --config p/secrets --error --metrics=off app .github

  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"

  build:
    runs-on: ubuntu-latest
    needs: [test]
    outputs:
      digest: ${{ steps.d.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        name: Package app and compute digest
        run: |
          tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 --numeric-owner -cf app.tar app
          echo "digest=sha256:$(sha256sum app.tar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: { name: app-tar, path: app.tar }

  ci-gate:
    runs-on: ubuntu-latest
    if: always()
    needs: [test, secrets, sast, deps, build]
    steps:
      - name: All required checks must be success
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[]|"\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null

  evidence:
    # Posts check results + artifact digest to the Paperclip release issue named by a commit trailer
    # ("Paperclip-Issue: SDL-9"). Skips quietly when no trailer or no credentials are configured.
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci-gate, build, test, secrets, sast, deps]
    env:
      PAPERCLIP_URL: ${{ vars.PAPERCLIP_URL }}
      PAPERCLIP_API_KEY: ${{ secrets.PAPERCLIP_API_KEY }}
      DIGEST: ${{ needs.build.outputs.digest }}
      RESULTS: ${{ toJSON(needs) }}
      RELEASE_ID: ci-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/post_evidence.sh
