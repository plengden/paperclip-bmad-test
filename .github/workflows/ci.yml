name: ci

# Required checks. Evidence is PULLED by Paperclip's ci_evidence tool (reads these jobs and the app-sha256-<digest> artifact name).
# Required checks. `ci-gate` is the single status that branch protection requires and that deploy.yml verifies.
# Third-party actions are pinned by tag for this prototype; pin by commit SHA before real use.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
        working-directory: app

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 detect --source=/repo --redact --no-banner

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: semgrep
        run: |
          python -m pip install --quiet semgrep
          semgrep scan --config p/javascript --config p/secrets --error --metrics=off app .github

  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"

  build:
    runs-on: ubuntu-latest
    needs: [test]
    outputs:
      digest: ${{ steps.d.outputs.digest }}
      hex: ${{ steps.d.outputs.hex }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        name: Package app and compute digest
        run: |
          tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 --numeric-owner -cf app.tar app
          hex=$(sha256sum app.tar | cut -d' ' -f1)
          echo "digest=sha256:$hex" >> "$GITHUB_OUTPUT"
          echo "hex=$hex" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: { name: 'app-sha256-${{ steps.d.outputs.hex }}', path: app.tar }

  risk-class:
    # Computes the change's risk class from the diff (deterministic rules, decision 1). Evidence only: not part of ci-gate.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      class: ${{ steps.c.outputs.class }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Classifier unit tests
        run: node --test .github/scripts/classify.test.mjs
      - id: c
        name: Classify
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node .github/scripts/classify.mjs "$BASE" "$HEAD" | tee risk-class.json
          echo "class=$(jq -r .class risk-class.json)" >> "$GITHUB_OUTPUT"
          { echo "### Risk class: $(jq -r .class risk-class.json)"; jq -r '.reasons[] | "- " + .' risk-class.json; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: 'risk-class-${{ steps.c.outputs.class }}', path: risk-class.json }

  human-gate:
    # Human merge gate for class `high`: waits for the required reviewer of the `high-risk-merge` environment.
    # Skipped for docs and standard. ci-gate (the required status) fails if a high PR has no approved human-gate.
    needs: [risk-class]
    if: needs.risk-class.outputs.class == 'high'
    runs-on: ubuntu-latest
    environment: high-risk-merge
    steps:
      - run: echo "Human approval recorded by the high-risk-merge environment reviewer."

  ci-gate:
    runs-on: ubuntu-latest
    if: always()
    needs: [test, secrets, sast, deps, build, risk-class, human-gate]
    steps:
      - name: All required checks must be success
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[]|"\(.key): \(.value.result)"'
          # risk-class and human-gate only run on pull requests; on a PR, human-gate may be skipped only when the class is not high.
          echo "$RESULTS" | jq -e --arg ev "$EVENT" '
            .["risk-class"] as $rc
            | to_entries | all(.[];
                .value.result == "success"
                or ($ev != "pull_request" and (.key == "risk-class" or .key == "human-gate") and .value.result == "skipped")
                or ($ev == "pull_request" and .key == "human-gate" and .value.result == "skipped" and $rc.result == "success" and $rc.outputs.class != "high"))' > /dev/null
